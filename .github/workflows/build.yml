name: Build Saturn iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout the real Saturn source
        uses: actions/checkout@v4
        with:
          repository: Llennpie/Saturn
          ref: legacy
          path: Saturn
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 1: proves the IPA/signing pipeline works (should show a GREEN screen).
      - name: Build visible test app
        run: python build_ios.py test

      # Step 2: the real attempt. Allowed to fail; logs are uploaded either way.
      - name: Try compiling real Saturn
        continue-on-error: true
        run: python build_ios.py saturn

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SaturnResults
          path: |
            SaturnTest.ipa
            SaturnCompletePackage.ipa
            compile_errors.log
            link_errors.log
          if-no-files-found: ignore
